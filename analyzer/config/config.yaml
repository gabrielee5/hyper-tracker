# Phase 2 Analyzer Configuration

api:
  base_url: "https://api.hyperliquid.xyz"
  rate_limit_calls: 5        # Reduced from 20 to be more conservative
  rate_limit_period: 1       # seconds
  timeout: 10
  max_retries: 3
  retry_delay_on_429: 30     # Wait 30 seconds when hitting 429

analysis:
  min_trades: 30
  p_value_threshold: 0.01
  alert_score_threshold: 5
  monte_carlo_iterations: 1000
  reanalysis_interval_days: 7

database:
  phase1_db_path: "../fetcher/data/addresses.db"  # READ-ONLY
  phase2_db_path: "./data/analyzed_traders.db"
  batch_size: 100
  connection_timeout: 30

processing:
  concurrent_traders: 3          # Reduced from 10 to avoid rate limits
  batch_processing_interval: 300  # 5 minutes
  priority_recent_active_days: 7

dashboard:
  enabled: true
  host: "0.0.0.0"
  port: 5001  # Different from Phase 1 (5000)
  auto_refresh_seconds: 10

alerts:
  console_enabled: true
  log_file_enabled: true
  log_path: "./logs/bad_traders_alert.log"
  dashboard_enabled: true

logging:
  level: "INFO"
  file: "./logs/analyzer.log"
  max_bytes: 10485760  # 10MB
  backup_count: 5
