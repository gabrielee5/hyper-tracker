<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contrarian Signals Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        /* Parse.bot Design System - Base Setup */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 14px;
        }

        body {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
            background: #fff;
            color: #000;
            line-height: 1.5;
            min-height: 100vh;
            padding: 2.5rem 1.25rem;
        }

        /* Universal Transition */
        button, a, input, select, textarea, .card, .badge, .stat-box, tbody tr {
            transition: all 0.15s;
        }

        /* Layout */
        .container {
            max-width: 80rem;
            margin: 0 auto;
        }

        /* Header */
        header {
            background: #fff;
            border: 0.85px solid #e5e7eb;
            padding: 1.25rem;
            margin-bottom: 1.25rem;
        }

        h1 {
            color: #000;
            font-size: 2.25rem;
            font-weight: 600;
            line-height: 2.5rem;
            margin-bottom: 0.625rem;
        }

        .update-time {
            color: #6b7280;
            font-size: 0.875rem;
            margin-top: 0.625rem;
        }

        /* Stats */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.25rem;
            margin-top: 1.25rem;
        }

        .stat-box {
            padding: 1.25rem;
            background: #fff;
            border: 0.85px solid #e5e7eb;
            text-align: center;
        }

        .stat-box:hover {
            border-color: #9ca3af;
        }

        .stat-label {
            font-size: 0.75rem;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.025em;
            margin-bottom: 0.625rem;
        }

        .stat-value {
            font-size: 1.875rem;
            font-weight: 600;
            line-height: 2.25rem;
            color: #000;
        }

        /* Signals Container */
        .signals-container {
            background: #fff;
            border: 0.85px solid #e5e7eb;
            padding: 1.25rem;
        }

        .signals-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.25rem;
            padding-bottom: 1.25rem;
            border-bottom: 0.85px solid #e5e7eb;
        }

        .signals-title {
            font-size: 1.125rem;
            color: #000;
            font-weight: 600;
        }

        .auto-refresh {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.75rem;
            color: #6b7280;
            margin-top: 0.375rem;
        }

        /* Buttons */
        .refresh-btn {
            background: #000;
            color: #fff;
            border: none;
            padding: 0.625rem 1.25rem;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.875rem;
        }

        .refresh-btn:hover {
            background: #374151;
        }

        /* Table */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1.25rem;
        }

        thead {
            background: #f9fafb;
            border-bottom: 0.85px solid #e5e7eb;
        }

        th {
            padding: 0.9375rem 1.25rem;
            text-align: left;
            font-size: 0.75rem;
            font-weight: 500;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.025em;
        }

        th.right-align {
            text-align: right;
        }

        td {
            padding: 1.25rem;
            border-bottom: 0.85px solid #e5e7eb;
            font-size: 0.875rem;
        }

        tbody tr:hover {
            background: #f9fafb;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        /* Coin Name */
        .coin-name {
            font-weight: 600;
            font-size: 0.875rem;
            color: #000;
        }

        .coin-name-clickable {
            cursor: pointer;
        }

        .coin-name-clickable:hover {
            color: #000;
            text-decoration: underline;
        }

        /* Signal Colors - Using Design System */
        .signal-short-strong {
            color: #991b1b;
            font-weight: 600;
        }

        .signal-short-moderate {
            color: #854d0e;
            font-weight: 500;
        }

        .signal-long-strong {
            color: #166534;
            font-weight: 600;
        }

        .signal-long-moderate {
            color: #166534;
            font-weight: 500;
        }

        .signal-neutral {
            color: #6b7280;
        }

        /* Confidence Colors */
        .confidence-high {
            color: #166534;
            font-weight: 600;
        }

        .confidence-medium {
            color: #854d0e;
            font-weight: 500;
        }

        .confidence-low {
            color: #6b7280;
        }

        /* Position Bar */
        .position-bar-container {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .position-bar {
            flex: 1;
            height: 1.5rem;
            background: #f9fafb;
            border: 0.85px solid #e5e7eb;
            overflow: hidden;
            display: flex;
        }

        .bar-long {
            background: #ef4444;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 0.625rem;
            font-weight: 600;
        }

        .bar-short {
            background: #22c55e;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 0.625rem;
            font-weight: 600;
        }

        .position-label {
            font-size: 0.75rem;
            color: #6b7280;
            min-width: 7.5rem;
        }

        /* Status Messages */
        .loading {
            text-align: center;
            padding: 2.5rem;
            color: #6b7280;
            font-size: 0.875rem;
        }

        .no-signals {
            text-align: center;
            padding: 2.5rem;
            color: #9ca3af;
            font-size: 0.875rem;
        }

        /* Status Indicator - Circle allowed per design system */
        .status-indicator {
            width: 0.375rem;
            height: 0.375rem;
            border-radius: 9999px;
            background: #22c55e;
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse {
            50% { opacity: 0.5; }
        }

        /* Priority Badge */
        .priority-badge {
            display: inline-block;
            background: #fefce8;
            color: #854d0e;
            border: 0.85px solid #fef08a;
            padding: 0.125rem 0.625rem;
            font-size: 0.625rem;
            font-weight: 500;
            margin-left: 0.5rem;
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 50;
            align-items: center;
            justify-content: center;
            padding: 1.25rem;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: #fff;
            border: 0.85px solid #e5e7eb;
            max-width: 56rem;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            padding: 1.25rem;
            border-bottom: 0.85px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 1.125rem;
            color: #000;
            font-weight: 600;
        }

        .modal-close {
            background: #fff;
            border: 0.85px solid #e5e7eb;
            font-size: 1.25rem;
            color: #6b7280;
            cursor: pointer;
            padding: 0.25rem;
            width: 2rem;
            height: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close:hover {
            background: #f9fafb;
            border-color: #9ca3af;
            color: #000;
        }

        .modal-body {
            padding: 1.25rem;
        }

        .chart-container {
            position: relative;
            height: 25rem;
            margin-top: 1.25rem;
            background: #fafafa;
            border: 0.85px solid #e5e7eb;
            padding: 1.25rem;
        }

        .modal-loading {
            text-align: center;
            padding: 2.5rem;
            color: #6b7280;
        }

        .modal-error {
            text-align: center;
            padding: 2.5rem;
            color: #991b1b;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 0.5rem;
            height: 0.5rem;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #d1d5db;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #9ca3af;
        }

        /* Responsive */
        @media (max-width: 640px) {
            body {
                padding: 1.25rem;
            }

            h1 {
                font-size: 1.5rem;
                line-height: 2rem;
            }

            .stats-row {
                grid-template-columns: 1fr;
            }

            table {
                font-size: 0.75rem;
            }

            td, th {
                padding: 0.625rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Contrarian Signals Dashboard</h1>
            <div class="update-time" id="update-time">Loading...</div>
            <div class="stats-row">
                <div class="stat-box">
                    <div class="stat-label">Total Bad Traders</div>
                    <div class="stat-value" id="bad-traders-count">-</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">With Open Positions</div>
                    <div class="stat-value" id="traders-positions">-</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Active Signals</div>
                    <div class="stat-value" id="active-signals">-</div>
                </div>
            </div>
        </header>

        <div class="signals-container">
            <div class="signals-header">
                <div>
                    <div class="signals-title">Contrarian Trading Signals</div>
                    <div class="auto-refresh">
                        <div class="status-indicator"></div>
                        Auto-refreshing
                    </div>
                </div>
                <!-- <button class="refresh-btn" onclick="loadSignals()">Refresh Now</button> -->
            </div>

            <div id="signals-content">
                <div class="loading">Loading signals...</div>
            </div>
        </div>
    </div>

    <!-- Modal for confidence history chart -->
    <div id="confidenceModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modalCoinName">Confidence Score History</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div id="modalChartContent">
                <div class="modal-loading">Loading chart...</div>
            </div>
        </div>
    </div>

    <script>
        let priorityCoins = [];

        function formatTime(isoString) {
            if (!isoString) return 'Never';
            const date = new Date(isoString);
            return date.toLocaleString();
        }

        function formatConfidence(value) {
            return (value * 100).toFixed(0) + '%';
        }

        function getConfidenceClass(value) {
            if (value >= 0.75) return 'confidence-high';
            if (value >= 0.50) return 'confidence-medium';
            return 'confidence-low';
        }

        function getSignalClass(direction, strength) {
            const key = `${direction.toLowerCase()}-${strength.toLowerCase()}`;
            return `signal-${key}`;
        }

        function formatSignal(direction, strength) {
            const emoji = {
                'SHORT-STRONG': '🔴',
                'SHORT-MODERATE': '🟠',
                'LONG-STRONG': '🟢',
                'LONG-MODERATE': '🟡',
                'NEUTRAL-WEAK': '⚪'
            };
            const key = `${direction}-${strength}`;
            return `${emoji[key] || ''} ${direction}`;
        }

        function formatChange(change) {
            if (!change || change === 0) {
                return '<span style="color: #999;">(±0)</span>';
            } else if (change > 0) {
                return `<span style="color: #28a745;">(+${change})</span>`;
            } else {
                return `<span style="color: #dc3545;">(${change})</span>`;
            }
        }

        function formatConfidenceChange(change) {
            if (!change || change === 0) {
                return '<span style="color: #999; margin-left: 4px;">(±0%)</span>';
            }
            const changePercent = (change * 100).toFixed(0);
            if (change > 0) {
                return `<span style="color: #28a745; margin-left: 4px;">(+${changePercent}%)</span>`;
            } else {
                return `<span style="color: #dc3545; margin-left: 4px;">(${changePercent}%)</span>`;
            }
        }

        function createPositionBar(longPct, shortPct, longVal, shortVal, longChange = 0, shortChange = 0, isUsd = false) {
            const longLabel = isUsd ? `$${(longVal/1000).toFixed(0)}K` : Math.round(longVal);
            const shortLabel = isUsd ? `$${(shortVal/1000).toFixed(0)}K` : Math.round(shortVal);

            // Only show changes for count-based (not USD)
            const changeInfo = !isUsd ? `<div style="font-size: 11px; color: #666; margin-top: 4px;">
                L${formatChange(longChange)} S${formatChange(shortChange)}
            </div>` : '';

            return `
                <div>
                    <div class="position-bar-container">
                        <div class="position-bar">
                            <div class="bar-long" style="width: ${longPct}%">
                                ${longPct > 15 ? longPct.toFixed(0) + '%' : ''}
                            </div>
                            <div class="bar-short" style="width: ${shortPct}%">
                                ${shortPct > 15 ? shortPct.toFixed(0) + '%' : ''}
                            </div>
                        </div>
                        <div class="position-label">L:${longLabel} S:${shortLabel}</div>
                    </div>
                    ${changeInfo}
                </div>
            `;
        }

        function renderSignalsTable(signals) {
            if (signals.length === 0) {
                return '<div class="no-signals">No signals generated yet. Waiting for position data...</div>';
            }

            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>Coin</th>
                            <th>Signal</th>
                            <th>Strength</th>
                            <th class="right-align">Confidence</th>
                            <th class="right-align">Traders</th>
                            <th>Count-Based Positioning</th>
                            <th>Size-Weighted Positioning</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            for (const signal of signals) {
                const isPriority = priorityCoins.includes(signal.coin);
                const priorityBadge = isPriority ? '<span class="priority-badge">PRIORITY</span>' : '';

                // Get change values (default to 0 if not present)
                const totalChange = signal.total_traders_change || 0;
                const longChange = signal.long_count_change || 0;
                const shortChange = signal.short_count_change || 0;
                const confidenceChange = signal.confidence_score_change || 0;

                html += `
                    <tr>
                        <td><span class="coin-name coin-name-clickable" onclick="showConfidenceHistory('${signal.coin}')">${signal.coin}</span>${priorityBadge}</td>
                        <td class="${getSignalClass(signal.signal_direction, signal.signal_strength)}">
                            ${formatSignal(signal.signal_direction, signal.signal_strength)}
                        </td>
                        <td>${signal.signal_strength}</td>
                        <td class="right-align ${getConfidenceClass(signal.confidence_score)}">
                            ${formatConfidence(signal.confidence_score)} ${formatConfidenceChange(confidenceChange)}
                        </td>
                        <td class="right-align">
                            ${signal.bad_traders_total} ${formatChange(totalChange)}
                        </td>
                        <td>${createPositionBar(
                            signal.long_percentage,
                            signal.short_percentage,
                            signal.long_count,
                            signal.short_count,
                            longChange,
                            shortChange,
                            false
                        )}</td>
                        <td>${createPositionBar(
                            signal.long_usd_percentage,
                            signal.short_usd_percentage,
                            signal.long_usd_value,
                            signal.short_usd_value,
                            0,
                            0,
                            true
                        )}</td>
                    </tr>
                `;
            }

            html += `
                    </tbody>
                </table>
            `;

            return html;
        }

        async function loadSignals() {
            try {
                const response = await fetch('/api/signals');
                const data = await response.json();

                // Update stats
                document.getElementById('bad-traders-count').textContent = data.stats.bad_traders_count;
                document.getElementById('traders-positions').textContent = data.stats.traders_with_positions;
                document.getElementById('active-signals').textContent = data.stats.active_signals;
                document.getElementById('update-time').textContent = `Last updated: ${formatTime(data.stats.last_update)}`;

                // Store priority coins
                if (data.signals.length > 0 && data.signals[0].coin) {
                    // Assuming first few are priority (this is simplified, ideally passed from backend)
                    priorityCoins = data.signals.slice(0, 3).map(s => s.coin);
                }

                // Render signals table
                document.getElementById('signals-content').innerHTML = renderSignalsTable(data.signals);

            } catch (error) {
                console.error('Error loading signals:', error);
                document.getElementById('signals-content').innerHTML =
                    '<div class="no-signals">Error loading signals. Please try again.</div>';
            }
        }

        // Load signals on page load
        loadSignals();

        // Auto-refresh every 5 seconds
        setInterval(loadSignals, 5000);

        // Modal and chart functionality
        let confidenceChart = null;

        function closeModal() {
            const modal = document.getElementById('confidenceModal');
            modal.classList.remove('active');

            // Destroy existing chart
            if (confidenceChart) {
                confidenceChart.destroy();
                confidenceChart = null;
            }
        }

        // Close modal when clicking outside
        document.getElementById('confidenceModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // Close modal with ESC key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        async function showConfidenceHistory(coin) {
            const modal = document.getElementById('confidenceModal');
            const modalTitle = document.getElementById('modalCoinName');
            const chartContent = document.getElementById('modalChartContent');

            // Update modal title
            modalTitle.textContent = `${coin} - Confidence Score History (Last record first)`;

            // Show modal with loading state
            chartContent.innerHTML = '<div class="modal-loading">Loading chart...</div>';
            modal.classList.add('active');

            try {
                // Fetch confidence history
                const response = await fetch(`/api/confidence-history/${coin}`);
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Failed to fetch data');
                }

                if (!data.history || data.history.length === 0) {
                    chartContent.innerHTML = '<div class="modal-error">No historical data available for this asset yet.</div>';
                    return;
                }

                // Prepare chart data
                const timestamps = data.history.map(item => {
                    const date = new Date(item.timestamp);
                    return date.toLocaleString('en-US', {
                        month: 'short',
                        day: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit'
                    });
                });

                const confidenceScores = data.history.map(item => item.confidence_score * 100);

                // Create chart container
                chartContent.innerHTML = '<div class="chart-container"><canvas id="confidenceChart"></canvas></div>';

                // Destroy existing chart if any
                if (confidenceChart) {
                    confidenceChart.destroy();
                }

                // Create new chart with Parse.bot design system colors
                const ctx = document.getElementById('confidenceChart').getContext('2d');
                confidenceChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: timestamps,
                        datasets: [{
                            label: 'Confidence Score (%)',
                            data: confidenceScores,
                            borderColor: '#000',
                            backgroundColor: 'rgba(0, 0, 0, 0.05)',
                            borderWidth: 1,
                            fill: true,
                            tension: 0,
                            pointRadius: 3,
                            pointHoverRadius: 5,
                            pointBackgroundColor: '#000',
                            pointBorderColor: '#fff',
                            pointBorderWidth: 1
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                display: true,
                                position: 'top',
                                labels: {
                                    font: {
                                        family: 'ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace',
                                        size: 12
                                    },
                                    color: '#000'
                                }
                            },
                            title: {
                                display: false
                            },
                            tooltip: {
                                backgroundColor: '#fff',
                                titleColor: '#000',
                                bodyColor: '#000',
                                borderColor: '#e5e7eb',
                                borderWidth: 1,
                                padding: 10,
                                titleFont: {
                                    family: 'ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace',
                                    size: 12
                                },
                                bodyFont: {
                                    family: 'ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace',
                                    size: 12
                                },
                                callbacks: {
                                    label: function(context) {
                                        return 'Confidence: ' + context.parsed.y.toFixed(1) + '%';
                                    }
                                }
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                max: 100,
                                ticks: {
                                    font: {
                                        family: 'ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace',
                                        size: 11
                                    },
                                    color: '#6b7280',
                                    callback: function(value) {
                                        return value + '%';
                                    }
                                },
                                grid: {
                                    color: '#e5e7eb',
                                    lineWidth: 0.85
                                }
                            },
                            x: {
                                grid: {
                                    display: false
                                },
                                ticks: {
                                    font: {
                                        family: 'ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace',
                                        size: 11
                                    },
                                    color: '#6b7280',
                                    maxRotation: 45,
                                    minRotation: 45
                                }
                            }
                        }
                    }
                });

            } catch (error) {
                console.error('Error loading confidence history:', error);
                chartContent.innerHTML = `<div class="modal-error">Error loading chart: ${error.message}</div>`;
            }
        }
    </script>
</body>
</html>
