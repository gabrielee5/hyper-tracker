<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contrarian Signals Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        h1 {
            color: #667eea;
            font-size: 32px;
            margin-bottom: 12px;
        }

        .stats-row {
            display: flex;
            gap: 20px;
            margin-top: 16px;
        }

        .stat-box {
            flex: 1;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 8px;
            color: white;
            text-align: center;
        }

        .stat-label {
            font-size: 12px;
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: bold;
            margin-top: 8px;
        }

        .update-time {
            color: #666;
            font-size: 14px;
            margin-top: 12px;
        }

        .signals-container {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .signals-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .signals-title {
            font-size: 24px;
            color: #667eea;
            font-weight: bold;
        }

        .refresh-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .refresh-btn:hover {
            background: #764ba2;
            transform: translateY(-2px);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
        }

        thead {
            background: #f8f9fa;
        }

        th {
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: #667eea;
            border-bottom: 2px solid #667eea;
        }

        th.right-align {
            text-align: right;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #e9ecef;
        }

        tbody tr:hover {
            background: #f8f9fa;
        }

        .coin-name {
            font-weight: bold;
            font-size: 16px;
            color: #333;
        }

        .signal-short-strong {
            color: #dc3545;
            font-weight: bold;
        }

        .signal-short-moderate {
            color: #fd7e14;
            font-weight: 600;
        }

        .signal-long-strong {
            color: #28a745;
            font-weight: bold;
        }

        .signal-long-moderate {
            color: #20c997;
            font-weight: 600;
        }

        .signal-neutral {
            color: #6c757d;
        }

        .confidence-high {
            color: #28a745;
            font-weight: bold;
        }

        .confidence-medium {
            color: #ffc107;
            font-weight: 600;
        }

        .confidence-low {
            color: #6c757d;
        }

        .position-bar-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .position-bar {
            flex: 1;
            height: 24px;
            background: #e9ecef;
            border-radius: 4px;
            overflow: hidden;
            display: flex;
        }

        .bar-long {
            background: linear-gradient(90deg, #dc3545 0%, #ff6b7a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 11px;
            font-weight: bold;
        }

        .bar-short {
            background: linear-gradient(90deg, #20c997 0%, #4dd4ac 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 11px;
            font-weight: bold;
        }

        .position-label {
            font-size: 12px;
            color: #666;
            min-width: 120px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .no-signals {
            text-align: center;
            padding: 40px;
            color: #999;
            font-size: 16px;
        }

        .auto-refresh {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #666;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #28a745;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .priority-badge {
            display: inline-block;
            background: #ffc107;
            color: #000;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
            margin-left: 8px;
        }

        /* Modal styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            padding: 32px;
            max-width: 900px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 16px;
        }

        .modal-title {
            font-size: 24px;
            color: #667eea;
            font-weight: bold;
        }

        .modal-close {
            background: transparent;
            border: none;
            font-size: 28px;
            color: #999;
            cursor: pointer;
            padding: 0;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.2s;
        }

        .modal-close:hover {
            background: #f0f0f0;
            color: #333;
        }

        .chart-container {
            position: relative;
            height: 400px;
            margin-top: 20px;
        }

        .coin-name-clickable {
            cursor: pointer;
            transition: color 0.2s;
        }

        .coin-name-clickable:hover {
            color: #667eea;
            text-decoration: underline;
        }

        .modal-loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .modal-error {
            text-align: center;
            padding: 40px;
            color: #dc3545;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Contrarian Signals Dashboard</h1>
            <div class="update-time" id="update-time">Loading...</div>
            <div class="stats-row">
                <div class="stat-box">
                    <div class="stat-label">Total Bad Traders</div>
                    <div class="stat-value" id="bad-traders-count">-</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">With Open Positions</div>
                    <div class="stat-value" id="traders-positions">-</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Active Signals</div>
                    <div class="stat-value" id="active-signals">-</div>
                </div>
            </div>
        </header>

        <div class="signals-container">
            <div class="signals-header">
                <div>
                    <div class="signals-title">Contrarian Trading Signals</div>
                    <div class="auto-refresh">
                        <div class="status-indicator"></div>
                        Auto-refreshing
                    </div>
                </div>
                <button class="refresh-btn" onclick="loadSignals()">Refresh Now</button>
            </div>

            <div id="signals-content">
                <div class="loading">Loading signals...</div>
            </div>
        </div>
    </div>

    <!-- Modal for confidence history chart -->
    <div id="confidenceModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modalCoinName">Confidence Score History</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div id="modalChartContent">
                <div class="modal-loading">Loading chart...</div>
            </div>
        </div>
    </div>

    <script>
        let priorityCoins = [];

        function formatTime(isoString) {
            if (!isoString) return 'Never';
            const date = new Date(isoString);
            return date.toLocaleString();
        }

        function formatConfidence(value) {
            return (value * 100).toFixed(0) + '%';
        }

        function getConfidenceClass(value) {
            if (value >= 0.75) return 'confidence-high';
            if (value >= 0.50) return 'confidence-medium';
            return 'confidence-low';
        }

        function getSignalClass(direction, strength) {
            const key = `${direction.toLowerCase()}-${strength.toLowerCase()}`;
            return `signal-${key}`;
        }

        function formatSignal(direction, strength) {
            const emoji = {
                'SHORT-STRONG': '🔴',
                'SHORT-MODERATE': '🟠',
                'LONG-STRONG': '🟢',
                'LONG-MODERATE': '🟡',
                'NEUTRAL-WEAK': '⚪'
            };
            const key = `${direction}-${strength}`;
            return `${emoji[key] || ''} ${direction}`;
        }

        function formatChange(change) {
            if (!change || change === 0) {
                return '<span style="color: #999;">(±0)</span>';
            } else if (change > 0) {
                return `<span style="color: #28a745;">(+${change})</span>`;
            } else {
                return `<span style="color: #dc3545;">(${change})</span>`;
            }
        }

        function formatConfidenceChange(change) {
            if (!change || change === 0) {
                return '<span style="color: #999; margin-left: 4px;">(±0%)</span>';
            }
            const changePercent = (change * 100).toFixed(0);
            if (change > 0) {
                return `<span style="color: #28a745; margin-left: 4px;">(+${changePercent}%)</span>`;
            } else {
                return `<span style="color: #dc3545; margin-left: 4px;">(${changePercent}%)</span>`;
            }
        }

        function createPositionBar(longPct, shortPct, longVal, shortVal, longChange = 0, shortChange = 0, isUsd = false) {
            const longLabel = isUsd ? `$${(longVal/1000).toFixed(0)}K` : Math.round(longVal);
            const shortLabel = isUsd ? `$${(shortVal/1000).toFixed(0)}K` : Math.round(shortVal);

            // Only show changes for count-based (not USD)
            const changeInfo = !isUsd ? `<div style="font-size: 11px; color: #666; margin-top: 4px;">
                L${formatChange(longChange)} S${formatChange(shortChange)}
            </div>` : '';

            return `
                <div>
                    <div class="position-bar-container">
                        <div class="position-bar">
                            <div class="bar-long" style="width: ${longPct}%">
                                ${longPct > 15 ? longPct.toFixed(0) + '%' : ''}
                            </div>
                            <div class="bar-short" style="width: ${shortPct}%">
                                ${shortPct > 15 ? shortPct.toFixed(0) + '%' : ''}
                            </div>
                        </div>
                        <div class="position-label">L:${longLabel} S:${shortLabel}</div>
                    </div>
                    ${changeInfo}
                </div>
            `;
        }

        function renderSignalsTable(signals) {
            if (signals.length === 0) {
                return '<div class="no-signals">No signals generated yet. Waiting for position data...</div>';
            }

            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>Coin</th>
                            <th>Signal</th>
                            <th>Strength</th>
                            <th class="right-align">Confidence</th>
                            <th class="right-align">Traders</th>
                            <th>Count-Based Positioning</th>
                            <th>Size-Weighted Positioning</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            for (const signal of signals) {
                const isPriority = priorityCoins.includes(signal.coin);
                const priorityBadge = isPriority ? '<span class="priority-badge">PRIORITY</span>' : '';

                // Get change values (default to 0 if not present)
                const totalChange = signal.total_traders_change || 0;
                const longChange = signal.long_count_change || 0;
                const shortChange = signal.short_count_change || 0;
                const confidenceChange = signal.confidence_score_change || 0;

                html += `
                    <tr>
                        <td><span class="coin-name coin-name-clickable" onclick="showConfidenceHistory('${signal.coin}')">${signal.coin}</span>${priorityBadge}</td>
                        <td class="${getSignalClass(signal.signal_direction, signal.signal_strength)}">
                            ${formatSignal(signal.signal_direction, signal.signal_strength)}
                        </td>
                        <td>${signal.signal_strength}</td>
                        <td class="right-align ${getConfidenceClass(signal.confidence_score)}">
                            ${formatConfidence(signal.confidence_score)} ${formatConfidenceChange(confidenceChange)}
                        </td>
                        <td class="right-align">
                            ${signal.bad_traders_total} ${formatChange(totalChange)}
                        </td>
                        <td>${createPositionBar(
                            signal.long_percentage,
                            signal.short_percentage,
                            signal.long_count,
                            signal.short_count,
                            longChange,
                            shortChange,
                            false
                        )}</td>
                        <td>${createPositionBar(
                            signal.long_usd_percentage,
                            signal.short_usd_percentage,
                            signal.long_usd_value,
                            signal.short_usd_value,
                            0,
                            0,
                            true
                        )}</td>
                    </tr>
                `;
            }

            html += `
                    </tbody>
                </table>
            `;

            return html;
        }

        async function loadSignals() {
            try {
                const response = await fetch('/api/signals');
                const data = await response.json();

                // Update stats
                document.getElementById('bad-traders-count').textContent = data.stats.bad_traders_count;
                document.getElementById('traders-positions').textContent = data.stats.traders_with_positions;
                document.getElementById('active-signals').textContent = data.stats.active_signals;
                document.getElementById('update-time').textContent = `Last updated: ${formatTime(data.stats.last_update)}`;

                // Store priority coins
                if (data.signals.length > 0 && data.signals[0].coin) {
                    // Assuming first few are priority (this is simplified, ideally passed from backend)
                    priorityCoins = data.signals.slice(0, 3).map(s => s.coin);
                }

                // Render signals table
                document.getElementById('signals-content').innerHTML = renderSignalsTable(data.signals);

            } catch (error) {
                console.error('Error loading signals:', error);
                document.getElementById('signals-content').innerHTML =
                    '<div class="no-signals">Error loading signals. Please try again.</div>';
            }
        }

        // Load signals on page load
        loadSignals();

        // Auto-refresh every 5 seconds
        setInterval(loadSignals, 5000);

        // Modal and chart functionality
        let confidenceChart = null;

        function closeModal() {
            const modal = document.getElementById('confidenceModal');
            modal.classList.remove('active');

            // Destroy existing chart
            if (confidenceChart) {
                confidenceChart.destroy();
                confidenceChart = null;
            }
        }

        // Close modal when clicking outside
        document.getElementById('confidenceModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // Close modal with ESC key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        async function showConfidenceHistory(coin) {
            const modal = document.getElementById('confidenceModal');
            const modalTitle = document.getElementById('modalCoinName');
            const chartContent = document.getElementById('modalChartContent');

            // Update modal title
            modalTitle.textContent = `${coin} - Confidence Score History`;

            // Show modal with loading state
            chartContent.innerHTML = '<div class="modal-loading">Loading chart...</div>';
            modal.classList.add('active');

            try {
                // Fetch confidence history
                const response = await fetch(`/api/confidence-history/${coin}`);
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Failed to fetch data');
                }

                if (!data.history || data.history.length === 0) {
                    chartContent.innerHTML = '<div class="modal-error">No historical data available for this asset yet.</div>';
                    return;
                }

                // Prepare chart data
                const timestamps = data.history.map(item => {
                    const date = new Date(item.timestamp);
                    return date.toLocaleString('en-US', {
                        month: 'short',
                        day: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit'
                    });
                });

                const confidenceScores = data.history.map(item => item.confidence_score * 100);

                // Create chart container
                chartContent.innerHTML = '<div class="chart-container"><canvas id="confidenceChart"></canvas></div>';

                // Destroy existing chart if any
                if (confidenceChart) {
                    confidenceChart.destroy();
                }

                // Create new chart
                const ctx = document.getElementById('confidenceChart').getContext('2d');
                confidenceChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: timestamps,
                        datasets: [{
                            label: 'Confidence Score (%)',
                            data: confidenceScores,
                            borderColor: '#667eea',
                            backgroundColor: 'rgba(102, 126, 234, 0.1)',
                            borderWidth: 2,
                            fill: true,
                            tension: 0.4,
                            pointRadius: 4,
                            pointHoverRadius: 6,
                            pointBackgroundColor: '#667eea',
                            pointBorderColor: '#fff',
                            pointBorderWidth: 2
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                display: true,
                                position: 'top',
                            },
                            title: {
                                display: false
                            },
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        return 'Confidence: ' + context.parsed.y.toFixed(1) + '%';
                                    }
                                }
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                max: 100,
                                ticks: {
                                    callback: function(value) {
                                        return value + '%';
                                    }
                                },
                                grid: {
                                    color: 'rgba(0, 0, 0, 0.05)'
                                }
                            },
                            x: {
                                grid: {
                                    display: false
                                },
                                ticks: {
                                    maxRotation: 45,
                                    minRotation: 45
                                }
                            }
                        }
                    }
                });

            } catch (error) {
                console.error('Error loading confidence history:', error);
                chartContent.innerHTML = `<div class="modal-error">Error loading chart: ${error.message}</div>`;
            }
        }
    </script>
</body>
</html>
