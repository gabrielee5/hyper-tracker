<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Follower Signals Dashboard</title>
    <style>
        /* Parse.bot Design System - Base Setup */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 14px;
        }

        body {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
            background: #fff;
            color: #000;
            line-height: 1.5;
            min-height: 100vh;
            padding: 2.5rem 1.25rem;
        }

        .container {
            max-width: 80rem;
            margin: 0 auto;
        }

        /* Header */
        header {
            background: #fff;
            border: 0.85px solid #e5e7eb;
            padding: 1.25rem;
            margin-bottom: 1.25rem;
            transition: all 0.15s;
        }

        header:hover {
            border-color: #9ca3af;
        }

        h1 {
            color: #000;
            font-size: 2.25rem;
            font-weight: 600;
            line-height: 2.5rem;
            margin-bottom: 0.625rem;
        }

        .update-time {
            color: #6b7280;
            font-size: 0.875rem;
            margin-top: 0.625rem;
        }

        /* Stats Grid */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.25rem;
            margin-top: 1.25rem;
        }

        .stat-box {
            background: #fff;
            border: 0.85px solid #e5e7eb;
            padding: 1.25rem;
            text-align: center;
            transition: all 0.15s;
        }

        .stat-box:hover {
            border-color: #9ca3af;
        }

        .stat-label {
            font-size: 0.75rem;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.025em;
            margin-bottom: 0.625rem;
        }

        .stat-value {
            font-size: 1.875rem;
            font-weight: 600;
            line-height: 2.25rem;
            color: #000;
        }

        /* Signals Container */
        .signals-container {
            background: #fff;
            border: 0.85px solid #e5e7eb;
            padding: 1.25rem;
            transition: all 0.15s;
        }

        .signals-container:hover {
            border-color: #9ca3af;
        }

        .signals-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.25rem;
        }

        .signals-title {
            font-size: 1.125rem;
            font-weight: 600;
            color: #000;
        }

        /* Button */
        .refresh-btn {
            background: #000;
            color: #fff;
            border: none;
            padding: 0.625rem 1.25rem;
            font-family: inherit;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.15s;
        }

        .refresh-btn:hover {
            background: #374151;
        }

        /* Table */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1.25rem;
        }

        thead {
            background: #f9fafb;
            border-bottom: 0.85px solid #e5e7eb;
        }

        th {
            padding: 0.9375rem 1.25rem;
            text-align: left;
            font-size: 0.75rem;
            font-weight: 500;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.025em;
        }

        th.right-align {
            text-align: right;
        }

        td {
            padding: 1.25rem;
            border-bottom: 0.85px solid #e5e7eb;
            font-size: 0.875rem;
        }

        tbody tr:hover {
            background: #f9fafb;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        /* Coin Name */
        .coin-name {
            font-weight: 600;
            font-size: 0.875rem;
            color: #000;
        }

        /* Signal Colors - Using Design System */
        .signal-short-strong {
            color: #991b1b;
            font-weight: 600;
        }

        .signal-short-moderate {
            color: #854d0e;
            font-weight: 500;
        }

        .signal-long-strong {
            color: #166534;
            font-weight: 600;
        }

        .signal-long-moderate {
            color: #166534;
            font-weight: 500;
        }

        .signal-neutral {
            color: #6b7280;
            font-weight: 500;
        }

        /* Confidence Colors */
        .confidence-high {
            color: #166534;
            font-weight: 600;
        }

        .confidence-medium {
            color: #854d0e;
            font-weight: 500;
        }

        .confidence-low {
            color: #6b7280;
            font-weight: 500;
        }

        /* Position Bar */
        .position-bar-container {
            display: flex;
            align-items: center;
            gap: 0.625rem;
        }

        .position-bar {
            flex: 1;
            height: 1.5rem;
            background: #f9fafb;
            border: 0.85px solid #e5e7eb;
            overflow: hidden;
            display: flex;
        }

        .bar-long {
            background: #22c55e;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 0.625rem;
            font-weight: 600;
        }

        .bar-short {
            background: #ef4444;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 0.625rem;
            font-weight: 600;
        }

        .position-label {
            font-size: 0.75rem;
            color: #6b7280;
            min-width: 7.5rem;
        }

        /* Loading & No Signals */
        .loading {
            text-align: center;
            padding: 2.5rem;
            color: #6b7280;
            font-size: 0.875rem;
        }

        .no-signals {
            text-align: center;
            padding: 2.5rem;
            color: #9ca3af;
            font-size: 0.875rem;
        }

        /* Auto Refresh */
        .auto-refresh {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.75rem;
            color: #6b7280;
            margin-top: 0.375rem;
        }

        /* Status Indicator */
        .status-indicator {
            width: 0.375rem;
            height: 0.375rem;
            border-radius: 9999px;
            background: #22c55e;
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse {
            50% { opacity: 0.5; }
        }

        /* Priority Badge */
        .priority-badge {
            display: inline-block;
            background: #fefce8;
            color: #854d0e;
            border: 0.85px solid #fef08a;
            padding: 0.125rem 0.625rem;
            font-size: 0.625rem;
            font-weight: 500;
            margin-left: 0.5rem;
        }

        /* Responsive */
        @media (max-width: 640px) {
            body {
                padding: 1.25rem;
            }

            h1 {
                font-size: 1.5rem;
                line-height: 2rem;
            }

            .signals-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }

            .stats-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Follower Signals Dashboard</h1>
            <div class="update-time" id="update-time">Loading...</div>
            <div class="stats-row">
                <div class="stat-box">
                    <div class="stat-label">Total Good Traders</div>
                    <div class="stat-value" id="good-traders-count">-</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">With Open Positions</div>
                    <div class="stat-value" id="traders-positions">-</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Active Signals</div>
                    <div class="stat-value" id="active-signals">-</div>
                </div>
            </div>
        </header>

        <div class="signals-container">
            <div class="signals-header">
                <div>
                    <div class="signals-title">Follower Trading Signals</div>
                    <div class="auto-refresh">
                        <div class="status-indicator"></div>
                        Auto-refreshing
                    </div>
                </div>
                <button class="refresh-btn" onclick="loadSignals()">Refresh Now</button>
            </div>

            <div id="signals-content">
                <div class="loading">Loading signals...</div>
            </div>
        </div>
    </div>

    <script>
        let priorityCoins = [];

        function formatTime(isoString) {
            if (!isoString) return 'Never';
            const date = new Date(isoString);
            return date.toLocaleString();
        }

        function formatConfidence(value) {
            return (value * 100).toFixed(0) + '%';
        }

        function getConfidenceClass(value) {
            if (value >= 0.75) return 'confidence-high';
            if (value >= 0.50) return 'confidence-medium';
            return 'confidence-low';
        }

        function getSignalClass(direction, strength) {
            const key = `${direction.toLowerCase()}-${strength.toLowerCase()}`;
            return `signal-${key}`;
        }

        function formatSignal(direction, strength) {
            return direction;
        }

        function formatChange(change) {
            if (!change || change === 0) {
                return '<span style="color: #9ca3af;">(±0)</span>';
            } else if (change > 0) {
                return `<span style="color: #166534;">(+${change})</span>`;
            } else {
                return `<span style="color: #991b1b;">(${change})</span>`;
            }
        }

        function formatConfidenceChange(change) {
            if (!change || change === 0) {
                return '<span style="color: #9ca3af; margin-left: 0.25rem;">(±0%)</span>';
            }
            const changePercent = (change * 100).toFixed(0);
            if (change > 0) {
                return `<span style="color: #166534; margin-left: 0.25rem;">(+${changePercent}%)</span>`;
            } else {
                return `<span style="color: #991b1b; margin-left: 0.25rem;">(${changePercent}%)</span>`;
            }
        }

        function createPositionBar(longPct, shortPct, longVal, shortVal, longChange = 0, shortChange = 0, isUsd = false) {
            const longLabel = isUsd ? `$${(longVal/1000).toFixed(0)}K` : Math.round(longVal);
            const shortLabel = isUsd ? `$${(shortVal/1000).toFixed(0)}K` : Math.round(shortVal);

            // Only show changes for count-based (not USD)
            const changeInfo = !isUsd ? `<div style="font-size: 0.625rem; color: #6b7280; margin-top: 0.25rem;">
                L${formatChange(longChange)} S${formatChange(shortChange)}
            </div>` : '';

            return `
                <div>
                    <div class="position-bar-container">
                        <div class="position-bar">
                            <div class="bar-long" style="width: ${longPct}%">
                                ${longPct > 15 ? longPct.toFixed(0) + '%' : ''}
                            </div>
                            <div class="bar-short" style="width: ${shortPct}%">
                                ${shortPct > 15 ? shortPct.toFixed(0) + '%' : ''}
                            </div>
                        </div>
                        <div class="position-label">L:${longLabel} S:${shortLabel}</div>
                    </div>
                    ${changeInfo}
                </div>
            `;
        }

        function renderSignalsTable(signals) {
            if (signals.length === 0) {
                return '<div class="no-signals">No signals generated yet. Waiting for position data...</div>';
            }

            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>Coin</th>
                            <th>Signal</th>
                            <th>Strength</th>
                            <th class="right-align">Confidence</th>
                            <th class="right-align">Traders</th>
                            <th>Count-Based Positioning</th>
                            <th>Size-Weighted Positioning</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            for (const signal of signals) {
                const isPriority = priorityCoins.includes(signal.coin);
                const priorityBadge = isPriority ? '<span class="priority-badge">PRIORITY</span>' : '';

                // Get change values (default to 0 if not present)
                const totalChange = signal.total_traders_change || 0;
                const longChange = signal.long_count_change || 0;
                const shortChange = signal.short_count_change || 0;
                const confidenceChange = signal.confidence_score_change || 0;

                html += `
                    <tr>
                        <td class="coin-name">${signal.coin}${priorityBadge}</td>
                        <td class="${getSignalClass(signal.signal_direction, signal.signal_strength)}">
                            ${formatSignal(signal.signal_direction, signal.signal_strength)}
                        </td>
                        <td>${signal.signal_strength}</td>
                        <td class="right-align ${getConfidenceClass(signal.confidence_score)}">
                            ${formatConfidence(signal.confidence_score)} ${formatConfidenceChange(confidenceChange)}
                        </td>
                        <td class="right-align">
                            ${signal.good_traders_total} ${formatChange(totalChange)}
                        </td>
                        <td>${createPositionBar(
                            signal.long_percentage,
                            signal.short_percentage,
                            signal.long_count,
                            signal.short_count,
                            longChange,
                            shortChange,
                            false
                        )}</td>
                        <td>${createPositionBar(
                            signal.long_usd_percentage,
                            signal.short_usd_percentage,
                            signal.long_usd_value,
                            signal.short_usd_value,
                            0,
                            0,
                            true
                        )}</td>
                    </tr>
                `;
            }

            html += `
                    </tbody>
                </table>
            `;

            return html;
        }

        async function loadSignals() {
            try {
                const response = await fetch('/api/signals');
                const data = await response.json();

                // Update stats
                document.getElementById('good-traders-count').textContent = data.stats.good_traders_count;
                document.getElementById('traders-positions').textContent = data.stats.traders_with_positions;
                document.getElementById('active-signals').textContent = data.stats.active_signals;
                document.getElementById('update-time').textContent = `Last updated: ${formatTime(data.stats.last_update)}`;

                // Store priority coins
                if (data.signals.length > 0 && data.signals[0].coin) {
                    // Assuming first few are priority (this is simplified, ideally passed from backend)
                    priorityCoins = data.signals.slice(0, 3).map(s => s.coin);
                }

                // Render signals table
                document.getElementById('signals-content').innerHTML = renderSignalsTable(data.signals);

            } catch (error) {
                console.error('Error loading signals:', error);
                document.getElementById('signals-content').innerHTML =
                    '<div class="no-signals">Error loading signals. Please try again.</div>';
            }
        }

        // Load signals on page load
        loadSignals();

        // Auto-refresh every 5 seconds
        setInterval(loadSignals, 5000);
    </script>
</body>
</html>
