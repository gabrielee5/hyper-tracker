# Observer Dashboard Configuration

api:
  base_url: "https://api.hyperliquid.xyz"
  rate_limit_calls: 20
  rate_limit_period: 1.0
  timeout: 10
  cache_ttl_seconds: 300  # 5 minutes for API data

database:
  analyzed_traders_db: "../data/analyzed_traders.db"  # Read-only source
  approved_traders_db: "../data/approved_traders.db"  # Observer's database
  connection_timeout: 30

dashboard:
  host: "127.0.0.1"
  port: 5006  # Unique port (analyzer: 5001, simulator: 5002)

filters:
  best_traders_min_score: 85
  best_traders_max_score: 100
  worst_traders_min_score: 0
  worst_traders_max_score: 10
  default_view: "best"  # Start with best traders

review:
  enable_rejection_log: true
  auto_advance_after_action: true  # Jump to next trader after approve/reject

logging:
  level: "INFO"
  file: "./logs/observer.log"
